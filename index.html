    display image

    the name of the image was changed so as to see the effect of the "alt" attribute-->

      </ul>

    <section>
        <!--Internal Navigation, the <a> tage which stands for 'Anchor', and responsible for navigation and links-->
          <a href="./">Home</a>
          <a href="./About/">About</a>
          <!--External Navigation-->
          <!--This is used to navigate from your site to other sites, by providing the link to those sites-->
          <a href="https://savealifehospital.com/">Check us out</a>
          <!--The target tag is used to determine if you want the site to open into a new tab or open in the same tab-->
          <a href="https://savealifehospital.com/" target="_blank">Check us Out</a>

          <!--Downloading Stuffs in HTML-->
          <!--The download attribute is used to download he stuffs from the html-->
          <a href="./assets/images/ball.jpg" download >Download here</a>

          <!--The control attribute helps to attach the controls tot eh media being embedded-->
          <video src="./assets/Video/bird flight.mp4" controls></video>

          <!--Forms in HTML-->
          <form>
            <label>Enter Your Name:</label>
            <input type="text" placeholder="name"/>
            <!--Remember that the input element is a self closing element.
            The palceholder is the element for whata you want to be inside the text area-->
            <input type="submit" value="send"/>
            <!--A value for a command that succeeds the submit action can be attached using teh "Value" option -->
            <label>Select a Pet</label>

            </select>
