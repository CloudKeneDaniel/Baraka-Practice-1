<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Page</title>
</head>
<body>
    <!--We use the dots for the Navigation.
    One dot if to navigate forward, two dots is to navigate backwards
    One dot is used if you are already on the html page you want to navigate and you don't need to put any name after the (a href=""), e.g >>(./about),
    But to navigate backwards to a previous page, you use double or two dots, e.g >>(../Home)-->

    <H1>About Us</H1>
    <a href="../">Home</a>
    <a href="./">About</a>
</body>
</html>
